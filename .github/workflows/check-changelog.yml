name: 检查更新日志

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-changelog:
    name: 检查 CHANGELOG.md 与生成物一致
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      # CHANGELOG.md 是唯一手写来源，res/version.json 与四处版本号都由它生成。
      # 这一步同时校验更新日志格式、五处版本号一致、生成物是最新的。
      - name: 检查更新日志格式与版本号一致性
        run: python scripts/changelog.py check

      # HEAD 是 GitHub 为当前 base 与 PR head 生成的合并提交，避免开放中的 PR
      # 因其他署名提交推进了 base 而被误判为删除历史条目。
      - name: 检查 PR 恰好新增一条更新日志
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/changelog.py check-pr "$PR_BASE_SHA" HEAD
