name: 检查 uv 锁文件

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  check-uv-lock:
    name: 检查 uv.lock 与依赖清单一致
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.3"

      - name: 检查 uv.lock 是否与清单一致
        run: uv lock --check
